openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Giveaway entry operations
  - name: giveaways
    description: Giveaway draw management
  - name: stripe
    description: Stripe payment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List all entries
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter entries by email address
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a new giveaway entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/giveaway/{giveawayId}:
    get:
      operationId: listEntriesByGiveaway
      tags: [entries]
      summary: List entries for a specific giveaway
      parameters:
        - name: giveawayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entries for the giveaway
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"

  /giveaways:
    get:
      operationId: listGiveaways
      tags: [giveaways]
      summary: List all active giveaways
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          description: If true, include inactive giveaways (admin use)
      responses:
        "200":
          description: List of giveaways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Giveaway"
    post:
      operationId: createGiveaway
      tags: [giveaways]
      summary: Create a new giveaway draw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiveawayInput"
      responses:
        "201":
          description: Giveaway created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /giveaways/{id}/winner:
    get:
      operationId: getGiveawayWinner
      tags: [giveaways]
      summary: Pick a random winner from the full entry pool for a giveaway
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Random winner selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Winner"
        "404":
          description: No entries found for this giveaway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /giveaways/{id}:
    get:
      operationId: getGiveaway
      tags: [giveaways]
      summary: Get a single giveaway by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "404":
          description: Giveaway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGiveaway
      tags: [giveaways]
      summary: Update a giveaway draw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiveawayUpdate"
      responses:
        "200":
          description: Giveaway updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "404":
          description: Giveaway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGiveaway
      tags: [giveaways]
      summary: Disable a giveaway draw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Giveaway disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Giveaway"
        "404":
          description: Giveaway not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/checkout:
    post:
      operationId: createStripeCheckout
      tags: [stripe]
      summary: Create a Stripe Checkout session for ticket purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCheckoutRequest"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCheckoutResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/session/{sessionId}:
    get:
      operationId: getStripeSession
      tags: [stripe]
      summary: Verify a completed Stripe session and create entry
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry created from session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeSessionEntry"
        "402":
          description: Payment not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Giveaway:
      type: object
      required: [id, name, description, prizeValue, prizeValueNumeric, maxEntries, drawDate, isActive, entryCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        prizeValue:
          type: string
        prizeValueNumeric:
          type: string
        maxEntries:
          type: integer
        drawDate:
          type: string
          format: date-time
        imageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        entryCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    GiveawayInput:
      type: object
      required: [name, description, prizeValue, prizeValueNumeric, maxEntries, drawDate]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        prizeValue:
          type: string
          minLength: 1
        prizeValueNumeric:
          type: number
        maxEntries:
          type: integer
          minimum: 1
        drawDate:
          type: string
          format: date-time
        imageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean

    GiveawayUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        prizeValue:
          type: string
          minLength: 1
        prizeValueNumeric:
          type: number
        maxEntries:
          type: integer
          minimum: 1
        drawDate:
          type: string
          format: date-time
        imageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean

    Entry:
      type: object
      required: [id, giveawayId, firstName, lastName, email, ticketQty, ticketNumbers, amountPaid, createdAt]
      properties:
        id:
          type: integer
        giveawayId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        ticketQty:
          type: integer
        ticketNumbers:
          type: array
          items:
            type: string
        amountPaid:
          type: string
        referralCode:
          type: string
          nullable: true
        stripeSessionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    EntryInput:
      type: object
      required: [giveawayId, firstName, lastName, email, ticketQty]
      properties:
        giveawayId:
          type: integer
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        ticketQty:
          type: integer
          minimum: 1
        ticketNumbers:
          type: array
          items:
            type: string
          nullable: true
        amountPaid:
          type: string
          nullable: true
        referralCode:
          type: string
          nullable: true
        stripeSessionId:
          type: string
          nullable: true

    StripeCheckoutRequest:
      type: object
      required: [giveawayId, ticketQty, firstName, lastName, email, amountCents]
      properties:
        giveawayId:
          type: integer
        ticketQty:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        amountCents:
          type: integer
        referralCode:
          type: string
          nullable: true

    StripeCheckoutResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    StripeSessionEntry:
      type: object
      required: [entry, ticketNumbers]
      properties:
        entry:
          $ref: "#/components/schemas/Entry"
        ticketNumbers:
          type: array
          items:
            type: string

    Winner:
      type: object
      required: [ticketNumber, firstName, lastName]
      properties:
        ticketNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

