kind = "mobile"
previewPath = "/mobile/"
title = "PrizePour Mobile"
version = "1.0.0"
id = "artifacts/prizepour-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19634

[services.development]
run = "pnpm --filter @workspace/prizepour-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prizepour-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/prizepour-mobile", "run", "serve" ]

[services.env]
PORT = "19634"
BASE_PATH = "/mobile/"
