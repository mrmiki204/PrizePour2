kind = "web"
previewPath = "/"
title = "Whiskey Giveaway"
version = "1.0.0"
id = "artifacts/whiskey-giveaway"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22940

[services.development]
run = "pnpm --filter @workspace/whiskey-giveaway run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whiskey-giveaway", "run", "build" ]
publicDir = "artifacts/whiskey-giveaway/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22940"
BASE_PATH = "/"
